<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALDEN NÅ</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0d1117;
color:white;
}

header{
padding:20px;
background:#151b24;
border-bottom:1px solid rgba(255,255,255,0.1);
position:sticky;
top:0;
}

h1{
margin:0;
font-size:32px;
}

.subtitle{
color:rgba(255,255,255,0.6);
margin-top:4px;
}

main{
padding:20px;
display:grid;
gap:16px;
}

.card{
background:#151b24;
padding:18px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.08);
}

.card small{
color:#ff453a;
font-weight:bold;
}

.card h2{
margin:10px 0;
}

.card p{
color:rgba(255,255,255,0.7);
line-height:1.5;
}
</style>
</head>

<body>

<header>
<h1>HALDEN NÅ</h1>
<div class="subtitle">Lokalt • Direkte • Åpent</div>
</header>

<main>

<div class="card">
<small>KORT FORKLART</small>
<h2>Velkommen til HALDEN NÅ</h2>
<p>Dette er første test av lokalavisa.</p>
</div>

<div class="card">
<small>LIVE</small>
<h2>Trafikk i sentrum</h2>
<p>Ingen større hendelser akkurat nå.</p>
</div>

</main>

</body>
</html>
