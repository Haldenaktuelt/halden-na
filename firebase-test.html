<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Firebase test</title>
</head>
<body>
  <h1>Firebase test</h1>
  <button id="testBtn">Send test til Firestore</button>
  <p id="status">Ikke testet</p>

  <script type="module">
    import {
      db,
      collection,
      addDoc,
      serverTimestamp
    } from "./00_firebase/firebase-db.js";

    document.getElementById("testBtn").addEventListener("click", async () => {
      try {
        await addDoc(collection(db, "tips"), {
          tekst: "Firebase test fra Halden Nå",
          status: "test",
          opprettetAt: serverTimestamp()
        });

        document.getElementById("status").textContent = "Firebase fungerer!";
      } catch (error) {
        console.error(error);
        document.getElementById("status").textContent = "Feil. Se Console.";
      }
    });
  </script>
</body>
</html>
